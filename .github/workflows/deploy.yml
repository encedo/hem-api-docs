name: Deploy to GitHub Pages

on:
  push:
    # TODO(M7): narrow to [main] once the migration branch is merged.
    branches: [main, docusaurus]
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time; do not cancel a running deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:spec
      - run: npm run build
      - name: API docs check (informational)
        run: node scripts/check-api-docs.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:spec
      - run: npm run typecheck
      - run: npm run build
      - name: API docs check (informational)
        run: node scripts/check-api-docs.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
